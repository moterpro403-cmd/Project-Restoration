name: Apply Neoplasm Heatmap Routing Update

on:
  push:
    branches: [restoration-fixes]
    paths:
      - '.merge/Neoplasm-Heatmap-Routing-Update.zip'
      - '.merge/apply_heatmap_update.py'
      - '.github/workflows/apply-heatmap-routing.yml'

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restoration-fixes
      - name: Set up Android build tools path
        run: echo "${ANDROID_HOME}/build-tools/34.0.0" >> $GITHUB_PATH
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply selected AI files and verify safeguards
        run: python3 .merge/apply_heatmap_update.py
      - name: Build Mindustry mod
        run: ./gradlew deploy
      - name: Verify JAR integrity
        run: |
          test -s build/libs/Project-Restoration.jar
          unzip -tq build/libs/Project-Restoration.jar
          jar tf build/libs/Project-Restoration.jar | grep -q 'mod.hjson'
      - name: Commit source and remove temporary transfer files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .merge/Neoplasm-Heatmap-Routing-Update.zip .merge/apply_heatmap_update.py
          rmdir .merge 2>/dev/null || true
          rm -f .github/workflows/apply-heatmap-routing.yml
          git add -A
          git commit -m "Merge mobile-safe strategic heatmap routing update"
          git push origin HEAD:restoration-fixes
      - name: Upload built mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Project-Restoration
          path: build/libs/Project-Restoration.jar
          if-no-files-found: error
          retention-days: 7
