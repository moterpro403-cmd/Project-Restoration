name: Export Neoplasm AI Dependencies

on:
  push:
    branches: [restoration-fixes]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package requested Java files
        run: |
          mkdir neoplasm-ai-dependencies
          cp src/classicMod/library/ai/NeoplasmAIController.java neoplasm-ai-dependencies/
          cp src/classicMod/library/ai/NeoplasmStrategicPathfinder.java neoplasm-ai-dependencies/
          cp src/classicMod/library/ai/PathfinderCustom.java neoplasm-ai-dependencies/
          cd neoplasm-ai-dependencies
          zip -j ../Neoplasm-AI-Dependencies.zip ./*
      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: Neoplasm-AI-Dependencies
          path: Neoplasm-AI-Dependencies.zip
          if-no-files-found: error
          retention-days: 7
