name: Build Project Restoration + The Mass (Mindustry 160.7)

on:
  workflow_dispatch:
  push:
    branches:
      - neoplasm-expansion

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Add preinstalled Android build-tools to PATH
        run: echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Reassemble The Mass source archive
        shell: bash
        run: |
          set -euo pipefail
          test -d .github/neoplasm-source
          cat .github/neoplasm-source/part-*.b64 > /tmp/themass-source.tar.xz.b64
          base64 --decode /tmp/themass-source.tar.xz.b64 > /tmp/themass-source.tar.xz
          tar -tJf /tmp/themass-source.tar.xz >/dev/null

      - name: Install additive The Mass Java sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src
          tar -xJf /tmp/themass-source.tar.xz -C src
          test -f src/themass/NeoplasmMod.java
          test -f src/themass/NeoplasmUnits.java

      - name: Build Android-compatible mod JAR
        run: |
          chmod +x ./gradlew
          ./gradlew clean deploy

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: Project-Restoration-The-Mass
          path: build/libs/Project-Restoration.jar
          if-no-files-found: error
