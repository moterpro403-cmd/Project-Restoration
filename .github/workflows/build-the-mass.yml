name: Build The Mass (Mindustry 160.7)

on:
  workflow_dispatch:
  push:
    branches:
      - neoplasm-expansion

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        uses: android-actions/setup-android@v3

      - name: Install zip tools
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Install The Mass sources
        run: |
          if [ ! -f the-mass-neoplasm-source.zip ]; then
            echo "::error::Upload the-mass-neoplasm-source.zip to the repository root on neoplasm-expansion."
            exit 1
          fi
          rm -rf /tmp/the-mass
          mkdir -p /tmp/the-mass
          unzip -q the-mass-neoplasm-source.zip -d /tmp/the-mass
          test -d /tmp/the-mass/the-mass-neoplasm/src/main/java/themass
          mkdir -p src
          cp -R /tmp/the-mass/the-mass-neoplasm/src/main/java/themass src/

      - name: Build Android-compatible mod JAR
        run: |
          chmod +x ./gradlew
          ./gradlew clean deploy

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: Project-Restoration-The-Mass
          path: build/libs/Project-Restoration.jar
          if-no-files-found: error
