name: Build The Mass (Mindustry 160.7)

on:
  workflow_dispatch:
  push:
    branches:
      - neoplasm-expansion

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        uses: android-actions/setup-android@v3

      - name: Install zip tools
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Reassemble The Mass source archive
        run: |
          set -euo pipefail
          test -d .github/neoplasm-archive-parts
          cat .github/neoplasm-archive-parts/part-*.b64 > /tmp/the-mass-source.b64
          base64 --decode /tmp/the-mass-source.b64 > the-mass-neoplasm-source.zip
          echo "22c808d642adb9e50066a26caeb5a370a9b252307138ba317b326cf019a04c19  the-mass-neoplasm-source.zip" | sha256sum --check

      - name: Install The Mass sources
        run: |
          set -euo pipefail
          rm -rf /tmp/the-mass
          mkdir -p /tmp/the-mass
          unzip -q the-mass-neoplasm-source.zip -d /tmp/the-mass
          test -d /tmp/the-mass/the-mass-neoplasm/src/main/java/themass
          mkdir -p src
          cp -R /tmp/the-mass/the-mass-neoplasm/src/main/java/themass src/

      - name: Build Android-compatible mod JAR
        run: |
          chmod +x ./gradlew
          ./gradlew clean deploy

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: Project-Restoration-The-Mass
          path: build/libs/Project-Restoration.jar
          if-no-files-found: error
