name: Apply Neoplasm Routing Update
on:
  push:
    branches: [restoration-fixes]
    paths:
      - ".merge/routing-source.tar.gz.b64"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restoration-fixes
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct and verify source archive
        run: |
          mkdir -p .merge/reconstructed
          base64 -d .merge/routing-source.tar.gz.b64 > .merge/routing-source.tar.gz
          echo "3855da21792ea2832f316f9b5ac48a6fc189f59bbefc28a7493098b682561704  .merge/routing-source.tar.gz" | sha256sum -c -
          tar -tzf .merge/routing-source.tar.gz
          tar -xzf .merge/routing-source.tar.gz -C .merge/reconstructed
      - name: Apply the five AI files
        run: |
          cp .merge/reconstructed/src/classicMod/library/ai/NeoplasmDeathHeatmap.java src/classicMod/library/ai/
          cp .merge/reconstructed/src/classicMod/library/ai/NeoplasmStrategicPathfinder.java src/classicMod/library/ai/
          cp .merge/reconstructed/src/classicMod/library/ai/NeoplasmFlyingAI.java src/classicMod/library/ai/
          cp .merge/reconstructed/src/classicMod/library/ai/NeoplasmAIController.java src/classicMod/library/ai/
          cp .merge/reconstructed/src/classicMod/library/ai/NeoplasmGroundAI.java src/classicMod/library/ai/
          rm -rf .merge
      - name: Commit source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/classicMod/library/ai/
          git commit -m "Apply Neoplasm heatmap routing update"
          git push origin HEAD:restoration-fixes
