name: Build Mod

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up PATH
        run: |
          echo "${ANDROID_HOME}/build-tools/34.0.0" >> $GITHUB_PATH
      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17
      - name: Merge selected Neoplasm AI fixes (push to restoration-fixes only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/restoration-fixes' && hashFiles('.merge/AI-Fixes.tar.xz') != ''
        run: |
          python3 .merge/merge_ai_fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/classicMod/library/ai/NeoplasmDeathHeatmap.java
          git add src/classicMod/library/ai/NeoplasmGroundAI.java
          git add src/classicMod/library/ai/NeoplasmFlyingAI.java
          git add src/classicMod/library/ai/PathfinderExtended.java
          git add src/classicMod/library/ai/NeoplasmAIController.java
          git add src/classicMod/library/ai/NeoplasmStrategicPathfinder.java
          git add src/classicMod/library/ai/PathfinderCustom.java
          git rm -r .merge
          git rm .github/workflows/merge-ai-fixes.yml
          git commit -m "Merge Neoplasm AI pathfinding fixes; preserve anti-hover"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Build mod jar
        run: ./gradlew deploy
      - name: Validate built jar
        run: unzip -t build/libs/${{ github.event.repository.name }}.jar
      - name: Upload built jar file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: build/libs/${{ github.event.repository.name }}.jar
          if-no-files-found: error
