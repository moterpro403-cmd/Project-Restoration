name: Apply Neoplasm AI Fix Archive

on:
  push:
    branches: [restoration-fixes]
    paths:
      - ".merge/AI-Fixes.tar.xz"

permissions:
  contents: write

jobs:
  merge-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restoration-fixes
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools on PATH
        run: echo "${ANDROID_HOME}/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Merge selected AI fixes while preserving anti-hover
        run: python3 .merge/merge_ai_fixes.py

      - name: Commit the seven merged source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/classicMod/library/ai/NeoplasmDeathHeatmap.java
          git add src/classicMod/library/ai/NeoplasmGroundAI.java
          git add src/classicMod/library/ai/NeoplasmFlyingAI.java
          git add src/classicMod/library/ai/PathfinderExtended.java
          git add src/classicMod/library/ai/NeoplasmAIController.java
          git add src/classicMod/library/ai/NeoplasmStrategicPathfinder.java
          git add src/classicMod/library/ai/PathfinderCustom.java
          git rm -r .merge
          git rm .github/workflows/merge-ai-fixes.yml
          git commit -m "Merge Neoplasm AI pathfinding fixes; preserve anti-hover"
          git push origin HEAD:restoration-fixes

      - name: Build Android-compatible mod
        run: ./gradlew deploy

      - name: Verify the JAR
        run: |
          unzip -t build/libs/Project-Restoration.jar
          jar tf build/libs/Project-Restoration.jar | grep -E 'Neoplasm(AIController|DeathHeatmap|StrategicPathfinder|FlyingAI|GroundAI)|Pathfinder(Custom|Extended)' | tee /tmp/ai-classes.txt
          test -s /tmp/ai-classes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Project-Restoration-Merged
          path: build/libs/Project-Restoration.jar
          if-no-files-found: error
