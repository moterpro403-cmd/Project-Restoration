apply plugin: "java"

version '0.6.0'

sourceSets.main.java.srcDirs = ["src"]

repositories {
    mavenCentral()
    maven { url "https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository" }
    maven { url 'https://www.jitpack.io' }
}

java {
    targetCompatibility = JavaVersion.VERSION_1_8
    sourceCompatibility = JavaVersion.VERSION_17
}

ext {
    mindustryVersion = 'v160.7'
    jabelVersion = "93fde537c7"
    isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
    sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
}

dependencies {
    compileOnly "com.github.Anuken.Arc:arc-core:$mindustryVersion"
    compileOnly "com.github.Anuken.Mindustry:core:$mindustryVersion"

    // Desugars Java 17 syntax down to Java 8 bytecode for Android d8 compatibility
    annotationProcessor "com.github.Anuken:jabel:$jabelVersion"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['--release', '8'])
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.github.Anuken.Arc') {
            details.useVersion "$mindustryVersion"
        }
    }
}

// Mindustry v160.7 libraries are published for Java 17. Resolve the API
// against Java 17 while Jabel and --release 8 keep this mod's output
// compatible with Android's D8 toolchain.
configurations.compileClasspath.attributes {
    attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
}

task jarAndroid {
    dependsOn "jar"

    doLast {
        if (!sdkRoot || !new File(sdkRoot).exists()) {
            throw new GradleException("No valid Android SDK found. Set ANDROID_HOME or ANDROID_SDK_ROOT.")
        }

        def platformRoot = new File("$sdkRoot/platforms/").listFiles()?.sort()?.reverse()?.find { f ->
            new File(f, "android.jar").exists()
        }
        if (!platformRoot) {
            throw new GradleException("No android.jar found in $sdkRoot/platforms/.")
        }

        def buildToolsRoot = new File("$sdkRoot/build-tools/").listFiles()?.sort()?.reverse()?.find { f ->
            new File(f, isWindows ? "d8.bat" : "d8").exists()
        }
        if (!buildToolsRoot) {
            throw new GradleException("No d8 found in $sdkRoot/build-tools/. Install Android SDK Build-Tools.")
        }

        def d8 = new File(buildToolsRoot, isWindows ? "d8.bat" : "d8").absolutePath
        def archiveName = base.archivesName.get()
        def libsDir = new File(layout.buildDirectory.get().asFile, "libs")

        def classpathFiles = configurations.compileClasspath.asList() + configurations.runtimeClasspath.asList() + [new File(platformRoot, "android.jar")]
        def cmdArgs = [d8]
        classpathFiles.each { file ->
            cmdArgs.addAll(["--classpath", file.absolutePath])
        }
        cmdArgs.addAll([
            "--min-api", "21",
            "--output", new File(libsDir, "${archiveName}Android.jar").absolutePath,
            new File(libsDir, "${archiveName}Desktop.jar").absolutePath
        ])

        // ProcessBuilder receives the executable and every argument separately.
        // Quoting a path inside a command string breaks execution on Linux.
        def proc = new ProcessBuilder(cmdArgs).directory(libsDir).start()
        proc.waitForProcessOutput(System.out, System.err)
        if (proc.exitValue() != 0) {
            throw new GradleException("d8 dexing failed with exit code ${proc.exitValue()}")
        }
    }
}

jar {
    archiveFileName = "${base.archivesName.get()}Desktop.jar"

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    from(rootDir) {
        include "mod.hjson"
    }

    from("assets/") {
        include "**"
    }
}

task deploy(type: Jar) {
    dependsOn jarAndroid
    dependsOn jar
    archiveFileName = "${base.archivesName.get()}.jar"

    def archiveName = base.archivesName.get()
    def libsDir = new File(layout.buildDirectory.get().asFile, "libs")

    from {
        [
            zipTree(new File(libsDir, "${archiveName}Desktop.jar")),
            zipTree(new File(libsDir, "${archiveName}Android.jar"))
        ]
    }

    doLast {
        delete(
            new File(libsDir, "${archiveName}Desktop.jar"),
            new File(libsDir, "${archiveName}Android.jar")
        )
    }
}
